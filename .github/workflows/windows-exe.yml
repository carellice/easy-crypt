# Crea EasyCrypt.exe per Windows e lo aggiunge alla release.
# Parte da solo quando «Pubblica release.command» pubblica una release; si può anche avviare a mano
# dalla scheda Actions indicando il tag di una release esistente.
name: EasyCrypt.exe per Windows

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag della release a cui aggiungere l'exe (es. v1.0.4)
        required: true

permissions:
  contents: write  # serve per caricare il file nella release

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        shell: bash
        working-directory: EasyCrypt-Mac-PC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installa PyInstaller
        run: python -m pip install --upgrade pyinstaller cryptography

      - name: Test della cifratura
        run: python test_easycrypt.py

      - name: Crea l'exe
        run: >
          pyinstaller --noconfirm --windowed --onefile --name EasyCrypt
          --icon icon.ico --add-data "icon.png;." easycrypt.py

      - name: Carica l'exe nella release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/EasyCrypt.exe "EasyCrypt-PC-${TAG#v}.exe"
          gh release upload "$TAG" "EasyCrypt-PC-${TAG#v}.exe" --clobber --repo "$GITHUB_REPOSITORY"
